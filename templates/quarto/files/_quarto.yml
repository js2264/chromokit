project:
  type: website

website:
  title: "{{name}}"
  description: "{{description}}"
  site-url: "{{url}}"
  repo-url: "https://github.com/{{repo}}"
  favicon: assets/mark.svg
  page-navigation: true
  search: true
  navbar:
    logo: assets/mark.svg
    left:
      - text: Get started
        href: getting-started.qmd
    tools:
      - icon: github
        href: "https://github.com/{{repo}}"
  sidebar:
    style: docked
    contents:
      - index.qmd
      - section: Getting started
        contents:
          - getting-started.qmd
  page-footer:
    left: "Documentation of {{name}} · [source](https://github.com/{{repo}})"
    right: "Built with [Quarto](https://quarto.org) and [chromokit](https://github.com/js2264/chromokit)"

format:
  chromokit-html:
    css: styles.css
