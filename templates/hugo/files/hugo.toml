baseURL = '{{url}}'
title = '{{name}}'
theme = 'chromokit'
languageCode = 'en'
enableRobotsTXT = true

[params]
  description = '{{description}}'
  repo = 'https://github.com/{{repo}}'
  mark = 'mark.svg'
  kicker = 'docs'
  version = '0.1.0'
  # Your own stylesheets, after chromokit's.
  css = ['site.css']
  # An optional button in the header:
  # cta = { text = 'Open the app', href = 'https://example.org' }

[markup.highlight]
  noClasses = false
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
