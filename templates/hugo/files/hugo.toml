baseURL = '{{url}}'
title = '{{name}}'
theme = 'chromokit'
languageCode = 'en'
enableRobotsTXT = true

[params]
  description = '{{description}}'
  repo = 'https://github.com/{{repo}}'
  mark = 'mark.svg'
  kicker = 'docs'
  version = '0.1.0'
  # Your own stylesheets, after chromokit's.
  css = ['site.css']
  # No bar across the top: the sidebar carries the name, the links and the
  # theme toggle instead.
  # header = false
  # Always light (or 'dark'), with no theme toggle:
  # palette = 'light'
  # A page's description in <head> only, not under its title:
  # showDescription = false
  # An optional button in the header:
  # cta = { text = 'Open the app', href = 'https://example.org' }
  # Icon links in the header (in the drawer on narrow screens); the icon is a
  # name from themes/chromokit/data/chromokit_icons.json:
  # links = [
  #   { name = 'Email', url = 'mailto:you@example.org', icon = 'mail' },
  #   { name = 'ORCID', url = 'https://orcid.org/…', icon = 'orcid' },
  # ]

# With a menu, the sidebar and the previous/next links follow it, Home first.
# Without one, they list the top-level pages, then each section.
# [[menus.main]]
#   name = 'About'
#   pageRef = '/about'
#   weight = 1

[markup.highlight]
  noClasses = false
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
